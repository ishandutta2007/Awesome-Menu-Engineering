<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#f5a623"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e0e0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" rx="12"/>

  <!-- Animated grid pattern -->
  <g opacity="0.06">
    <line x1="0" y1="50" x2="1200" y2="50" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="1200" y2="250" stroke="#fff" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="1100" y1="0" x2="1100" y2="300" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Animated floating circles (decorative) -->
  <circle cx="100" cy="80" r="40" fill="#e94560" opacity="0.08">
    <animate attributeName="cy" values="80;70;80" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="220" r="55" fill="#f5a623" opacity="0.07">
    <animate attributeName="cy" values="220;230;220" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="60" r="25" fill="#53c1de" opacity="0.1">
    <animate attributeName="cy" values="60;50;60" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="230" r="30" fill="#e94560" opacity="0.06">
    <animate attributeName="cy" values="230;240;230" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Menu/Chart icon -->
  <g transform="translate(80, 105)" filter="url(#glow)">
    <!-- Plate circle -->
    <circle cx="45" cy="45" r="42" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.9"/>
    <circle cx="45" cy="45" r="35" fill="none" stroke="#e94560" stroke-width="1" opacity="0.4"/>
    <!-- Fork -->
    <g transform="translate(20, 15)" stroke="#f5a623" stroke-width="2" fill="none" opacity="0.9">
      <line x1="0" y1="0" x2="0" y2="60"/>
      <line x1="0" y1="0" x2="0" y2="20"/>
      <line x1="-5" y1="0" x2="-5" y2="15"/>
      <line x1="5" y1="0" x2="5" y2="15"/>
    </g>
    <!-- Knife -->
    <g transform="translate(65, 15)" stroke="#e94560" stroke-width="2" fill="none" opacity="0.9">
      <line x1="0" y1="0" x2="0" y2="60"/>
      <path d="M0,0 Q8,10 0,25" stroke-width="2"/>
    </g>
    <!-- Bar chart inside plate -->
    <rect x="30" y="50" width="6" height="20" fill="#e94560" opacity="0.8" rx="1">
      <animate attributeName="height" values="20;28;20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="50;42;50" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="40" y="38" width="6" height="32" fill="#f5a623" opacity="0.8" rx="1">
      <animate attributeName="height" values="32;24;32" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="38;46;38" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="50" y="44" width="6" height="26" fill="#53c1de" opacity="0.8" rx="1">
      <animate attributeName="height" values="26;34;26" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="44;36;44" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Main title -->
  <text x="600" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="48" font-weight="700" fill="url(#textGrad)" text-anchor="middle" filter="url(#shadow)">
    Awesome Menu Engineering
  </text>

  <!-- Accent line -->
  <rect x="320" y="135" width="560" height="3" fill="url(#accent)" rx="2" opacity="0.8">
    <animate attributeName="width" values="560;600;560" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x" values="320;300;320" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtitle -->
  <text x="600" y="170" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#a0a0b8" text-anchor="middle" letter-spacing="1">
    Recipe Costing · Food Cost Control · Menu Profitability · Inventory Optimization
  </text>

  <!-- Tags row -->
  <g transform="translate(600, 200)" text-anchor="middle">
    <!-- SaaS tag -->
    <rect x="-260" y="-12" width="100" height="26" rx="13" fill="#e94560" opacity="0.2" stroke="#e94560" stroke-width="1"/>
    <text x="-210" y="6" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#e94560" text-anchor="middle" font-weight="600">☁️ SaaS</text>

    <!-- Open Source tag -->
    <rect x="-140" y="-12" width="130" height="26" rx="13" fill="#53c1de" opacity="0.2" stroke="#53c1de" stroke-width="1"/>
    <text x="-75" y="6" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#53c1de" text-anchor="middle" font-weight="600">🔓 Open Source</text>

    <!-- Pricing tag -->
    <rect x="10" y="-12" width="110" height="26" rx="13" fill="#f5a623" opacity="0.2" stroke="#f5a623" stroke-width="1"/>
    <text x="65" y="6" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#f5a623" text-anchor="middle" font-weight="600">💰 Pricing</text>

    <!-- Curated tag -->
    <rect x="140" y="-12" width="120" height="26" rx="13" fill="#2ecc71" opacity="0.2" stroke="#2ecc71" stroke-width="1"/>
    <text x="200" y="6" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#2ecc71" text-anchor="middle" font-weight="600">✅ Curated</text>
  </g>

  <!-- Bottom line -->
  <text x="600" y="260" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#666680" text-anchor="middle" letter-spacing="0.5">
    Curated list of SaaS products &amp; open-source projects for restaurant menu engineering
  </text>

  <!-- Pulsing dot indicator -->
  <circle cx="1150" cy="30" r="5" fill="#2ecc71">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="1135" y="35" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#2ecc71" text-anchor="end" opacity="0.8">LIVE</text>
</svg>
